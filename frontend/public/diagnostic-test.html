<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFlow Diagnostic Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 TerraFlow System Diagnostic</h1>
        <p>This page tests all critical system components to identify any issues.</p>
        
        <div class="controls">
            <button onclick="runAllTests()">🚀 Run All Tests</button>
            <button onclick="testBackendHealth()">❤️ Test Backend Health</button>
            <button onclick="testLogin()">🔐 Test Login</button>
            <button onclick="testRegistration()">📝 Test Registration</button>
            <button onclick="clearLog()">🧹 Clear Log</button>
        </div>
        
        <div id="results"></div>
        <div id="log" class="log">Diagnostic tool loaded. Click "Run All Tests" to begin...\n</div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        const logDiv = document.getElementById('log');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : type === 'success' ? '#44ff44' : '#00ff00';
            logDiv.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function showResult(title, status, message) {
            const className = status === 'success' ? 'success' : status === 'error' ? 'error' : 'info';
            const icon = status === 'success' ? '✅' : status === 'error' ? '❌' : 'ℹ️';
            resultsDiv.innerHTML += `<div class="test-result ${className}"><strong>${icon} ${title}</strong><br>${message}</div>`;
        }
        
        function clearLog() {
            logDiv.innerHTML = 'Log cleared...\n';
            resultsDiv.innerHTML = '';
        }
        
        async function testBackendHealth() {
            log('Testing backend health...');
            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log('✅ Backend health check passed', 'success');
                    showResult('Backend Health', 'success', `Server is running on port 5000. Environment: ${data.environment}`);
                    return true;
                } else {
                    log('❌ Backend health check failed', 'error');
                    showResult('Backend Health', 'error', 'Backend responded but health check failed');
                    return false;
                }
            } catch (error) {
                log(`❌ Backend connection failed: ${error.message}`, 'error');
                showResult('Backend Health', 'error', `Cannot connect to backend: ${error.message}`);
                return false;
            }
        }
        
        async function testLogin() {
            log('Testing login functionality...');
            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@terraflow.com',
                        password: 'admin123'
                    }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log('✅ Login test passed', 'success');
                    showResult('Login Test', 'success', `Admin login successful. Token received: ${data.token ? 'Yes' : 'No'}`);
                    return true;
                } else {
                    log('❌ Login test failed', 'error');
                    showResult('Login Test', 'error', `Login failed: ${data.message}`);
                    return false;
                }
            } catch (error) {
                log(`❌ Login test error: ${error.message}`, 'error');
                showResult('Login Test', 'error', `Login test failed: ${error.message}`);
                return false;
            }
        }
        
        async function testRegistration() {
            log('Testing registration functionality...');
            try {
                const testEmail = `test${Date.now()}@example.com`;
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        role: 'supplier',
                        fullName: 'Test User',
                        email: testEmail,
                        password: 'password123',
                        contactNo: '1234567890',
                        businessName: 'Test Business',
                        businessAddress: '123 Test St',
                        termsAccepted: true
                    }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log('✅ Registration test passed', 'success');
                    showResult('Registration Test', 'success', `User registered successfully with ID: ${data.data.id}`);
                    return true;
                } else {
                    log('❌ Registration test failed', 'error');
                    showResult('Registration Test', 'error', `Registration failed: ${data.message}`);
                    return false;
                }
            } catch (error) {
                log(`❌ Registration test error: ${error.message}`, 'error');
                showResult('Registration Test', 'error', `Registration test failed: ${error.message}`);
                return false;
            }
        }
        
        async function runAllTests() {
            log('=== STARTING COMPREHENSIVE SYSTEM TEST ===');
            resultsDiv.innerHTML = '';
            
            log('1. Testing backend connectivity...');
            const backendOk = await testBackendHealth();
            
            if (backendOk) {
                log('2. Testing authentication...');
                await testLogin();
                
                log('3. Testing registration...');
                await testRegistration();
            } else {
                log('❌ Skipping other tests due to backend connection failure', 'error');
            }
            
            log('=== TEST SUITE COMPLETE ===');
        }
        
        // Auto-run basic connectivity test on load
        window.addEventListener('load', () => {
            log('TerraFlow Diagnostic Tool loaded');
            log('Frontend URL: http://localhost:5175');
            log('Backend URL: http://localhost:5000');
            setTimeout(testBackendHealth, 1000);
        });
    </script>
</body>
</html>
