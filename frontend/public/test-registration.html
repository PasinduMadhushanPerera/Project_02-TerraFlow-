<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFlow Registration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 TerraFlow Registration Test</h1>
        <p>Test supplier registration to identify issues.</p>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" required>
                    <option value="customer">Customer</option>
                    <option value="supplier" selected>Supplier</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" value="Test Supplier User" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="testsupplier2@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="password123" required>
            </div>
            
            <div class="form-group">
                <label for="mobile">Mobile:</label>
                <input type="text" id="mobile" value="1234567890">
            </div>
            
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address">123 Test Street, Test City</textarea>
            </div>
            
            <div class="form-group">
                <label for="businessName">Business Name:</label>
                <input type="text" id="businessName" value="Test Supplier Business">
            </div>
            
            <div class="form-group">
                <label for="businessAddress">Business Address:</label>
                <textarea id="businessAddress">456 Business Ave, Business City</textarea>
            </div>
            
            <div class="form-group">
                <label for="contactNo">Contact Number:</label>
                <input type="text" id="contactNo" value="9876543210">
            </div>
            
            <button type="submit" id="registerBtn">🚀 Test Registration</button>
            <button type="button" onclick="clearForm()">🧹 Clear Form</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        const resultDiv = document.getElementById('result');
        const registerBtn = document.getElementById('registerBtn');
        
        function showResult(message, type = 'info') {
            resultDiv.innerHTML = `<div class="result ${type}">${message}</div>`;
        }
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const current = resultDiv.innerHTML;
            resultDiv.innerHTML = current + `<div class="result info">[${timestamp}] ${message}</div>`;
        }
        
        function clearForm() {
            document.getElementById('registrationForm').reset();
            resultDiv.innerHTML = '';
        }
        
        async function testRegistration(formData) {
            log('=== TESTING SUPPLIER REGISTRATION ===');
            log(`Sending data: ${JSON.stringify(formData, null, 2)}`);
            
            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...formData,
                        termsAccepted: true
                    }),
                });
                
                log(`Response status: ${response.status}`);
                log(`Response ok: ${response.ok}`);
                
                const result = await response.json();
                log(`Response data: ${JSON.stringify(result, null, 2)}`);
                
                if (response.ok && result.success) {
                    showResult(`✅ REGISTRATION SUCCESSFUL!
User ID: ${result.data.id}
Role: ${result.data.role}
Email: ${result.data.email}
Verified: ${result.data.isVerified}

Registration is working correctly!`, 'success');
                    return true;
                } else {
                    showResult(`❌ Registration failed: ${result.message}

Validation errors: ${result.errors ? JSON.stringify(result.errors, null, 2) : 'None'}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`Network/JavaScript error: ${error.message}`);
                showResult(`❌ Network error: ${error.message}`, 'error');
                return false;
            }
        }
        
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            registerBtn.disabled = true;
            registerBtn.textContent = '🔄 Testing...';
            
            resultDiv.innerHTML = '';
            log('Starting registration test...');
            
            // Collect form data
            const formData = {
                role: document.getElementById('role').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                mobile: document.getElementById('mobile').value,
                address: document.getElementById('address').value,
                businessName: document.getElementById('businessName').value,
                businessAddress: document.getElementById('businessAddress').value,
                contactNo: document.getElementById('contactNo').value
            };
            
            try {
                await testRegistration(formData);
            } catch (error) {
                showResult(`❌ Unexpected error: ${error.message}`, 'error');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = '🚀 Test Registration';
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            log('Registration test page loaded');
            log('Backend URL: http://localhost:5000');
            log('Fill in the form and click "Test Registration" to begin...');
        });
    </script>
</body>
</html>
